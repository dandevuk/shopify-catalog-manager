# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f28912af1b6a71b6390200d76a0216ef"
name = "Smart Catalogs Dev"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update", "products/delete" ]
  uri = "/webhooks/products"

  [[webhooks.subscriptions]]
  # Product index rebuilds (bulkOperationRunQuery) report back here
  topics = [ "bulk_operations/finish" ]
  uri = "/webhooks/bulk_operations/finish"

  [[webhooks.subscriptions]]
  # Adding products to a collection by hand fires these, not reliably products/update
  topics = [ "collections/create", "collections/update", "collections/delete" ]
  uri = "/webhooks/collections"

  [[webhooks.subscriptions]]
  topics = [ "publications/delete" ]
  uri = "/webhooks/publications"

  [[webhooks.subscriptions]]
  # Market changes refresh the catalog list. company_locations/* webhooks are
  # left out on purpose: Shopify classes them as protected customer data, and
  # the app avoids holding customer data. The catalog list is read live instead.
  topics = [ "markets/create", "markets/update", "markets/delete" ]
  uri = "/webhooks/catalog-contexts"

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_products (Phase 2, step 4): needed for catalogContextUpdate, which
# assigns B2B catalogs to company locations. Existing installs need to
# re-consent (reopen the app in the Shopify admin) before this scope is
# granted.
scopes = "read_products,read_publications,write_publications,read_markets,read_companies,write_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[sidekick]
# Required once the app has any Sidekick-eligible extension (extensions/catalog-tools).
extensions_summary = "Searches and explains the merchant's saved Smart Catalogs rules for Market and B2B catalogs, to help find or understand which catalog matches a described group of products or customers."
